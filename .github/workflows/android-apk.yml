name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle wrapper executable
        run: |
          find . -name "gradlew" -exec chmod +x {} +

      - name: Build debug APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew --no-daemon assembleDebug --stacktrace
          else
            SUBDIR=$(find . -maxdepth 2 -name "gradlew" -printf "%h\n" | head -n 1)
            if [ -n "$SUBDIR" ]; then
              echo "Found project in subdirectory: $SUBDIR"
              cd "$SUBDIR"
              ./gradlew --no-daemon assembleDebug --stacktrace
            else
              echo "Error: gradlew not found!" && exit 1
            fi
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: IQOption-TradePro-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          retention-days: 14
